<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아테나 로그인·조회 검사</title>
<style>
body{max-width:620px;margin:40px auto;padding:0 20px;font:16px/1.7 system-ui,sans-serif;color:#222}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:10px;font:inherit}button{padding:10px 16px;margin:6px 6px 6px 0;font:inherit;cursor:pointer}#result{padding:16px;background:#f0f4f8;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#555}
</style></head>
<body>
<h1>아테나 로그인·조회 검사</h1>
<p>현재 열어둔 아테나 창을 유지한 상태에서 진행하세요. 이 검사는 이미지 등록 없이 로그인과 이미지관리 목록 접근만 확인합니다.</p>
<form id="login">
<label>아테나 아이디<input id="username" name="username" autocomplete="username" required></label>
<label>아테나 비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">1. 아테나 로그인 검사</button>
</form>
<button id="check" type="button">2. 이미지관리 목록 조회</button>
<button id="logout" type="button">검사 세션 종료</button>
<p id="result" role="status" aria-live="polite">검사 준비 완료</p>
<p><strong>조회 성공 후:</strong> 기존 아테나 창을 새로고침해 로그인이 유지되는지 확인해주세요. 이 화면에서는 브라우저 쪽 로그인 유지 여부를 자동 판정할 수 없습니다.</p>
<small>비밀번호는 인증 요청에만 사용합니다. 아테나 쿠키는 서버 메모리에 최대 15분 보관하며 브라우저·파일·로그로 전달하지 않습니다. 창을 닫기 전에 ‘검사 세션 종료’를 눌러주세요.</small>
<script src="/athena-session-test.js"></script>
</body></html>
